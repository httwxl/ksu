name: One-Click KernelSU Next Build for Multiple Devices

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: "选择要编译的设备"
        required: true
        type: choice
        options:
          - 10T
          - 11
          - 12
          - 12r
          - 13
          - Ace2
          - Ace2Pro
          - Ace3Pro
          - Ace3V
          - Ace5
          - Ace5Pro
          - AcePro
          - PadPro
        default: "Ace2"

jobs:
  # Build for 10T
  build_10T:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.DEVICE == '10T' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up build environment
        run: |
          # 设置必要的环境，如安装依赖
          sudo apt update
          sudo apt install -y build-essential
      - name: Build Kernel for 10T
        run: |
          # 这里放置具体的构建命令
          echo "Building Kernel for 10T"
          # 你可能需要运行实际的编译命令
          ./build_kernel_10T.sh

  # Build for 11
  build_11:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.DEVICE == '11' }}

