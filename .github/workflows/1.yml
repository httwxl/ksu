name: One-Click KernelSU Next Build for Multiple Devices

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: "选择要编译的设备"
        required: true
        type: choice
        options:
          - 10T
          - 11
          - 12
          - 12r
          - 13
          - Ace2
          - Ace2Pro
          - Ace3Pro
          - Ace3V
          - Ace5
          - Ace5Pro
          - AcePro
          - PadPro
        default: "Ace2"

jobs:
