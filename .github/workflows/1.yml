  build_10T:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.DEVICE == '10T' }}

    steps:
      # 在此处添加 `Build-ksunext-10T-SUSFS.yml` 中的所有步骤
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Build 10T Kernel
        run: |
          # 你的编译命令，替换为实际命令
          echo "Building Kernel for 10T"

