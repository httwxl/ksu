name: Universal Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device_list:
        description: '设备列表 (逗号分隔或 "all")'
        required: false
        default: "all"
      android_version:
        description: "安卓版本"
        required: true
        default: "android13"
      kernel_version:
        description: "内核版本"
        required: true
        default: "5.15"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ 
          inputs.device_list == 'all' 
          && fromJson('["10T","11","12","12r","13","Ace2","Ace2Pro","Ace3Pro","Ace3V","Ace5","Ace5Pro","AcePro","PadPro"]') 
          || fromJson(format('["{0}"]', replace(inputs.device_list, ',', '","')))
        include:
          # 设备参数映射表
          - device: 10T
            cpu: sm8550
            feil: oneplus_10t_v
            cpud: kalama
          - device: Ace2Pro
            cpu: sm8550
            feil: oneplus_ace2pro_v
            cpud: kalama
          - device: PadPro
            cpu: sm8475
            feil: oneplus_padpro_v
            cpud: taro
          # 其他设备参数在此追加...

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          remove-dotnet: 'true'

      - name: Setup environment
        run: |
          sudo apt update
          sudo apt install -y python3 jq git-core bc bison flex libssl-dev

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize kernel workspace
        run: |
          mkdir kernel_${ { matrix.device } } && cd kernel_${ { matrix.device } }
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/${ { matrix.cpu } } \
            -m ${ { matrix.feil } }.xml \
            --depth=1
          repo sync -j$(nproc) -c --no-tags

      - name: Apply device patches
        run: |
          cd kernel_${ { matrix.device } }
          # 动态应用设备特定补丁
          case "${ { matrix.device } }" in
            "Ace2Pro")
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              git apply patches/ace2pro_susfs.patch
              ;;
            "PadPro")
              git apply patches/padpro_thermal.patch
              ;;
            *)
              echo "No special patches for ${ { matrix.device } }"
              ;;
          esac

      - name: Configure kernel
        run: |
          cd kernel_${ { matrix.device } }/kernel_platform
          echo "CONFIG_KSU=y" >> common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> common/arch/arm64/configs/gki_defconfig
          # 更多动态配置...

      - name: Build kernel
        env:
          BUILD_ARGS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
        run: |
          cd kernel_${ { matrix.device } }
          ./oplus/build/oplus_build_kernel.sh ${ { matrix.cpud } } gki

      - name: Package artifacts
        run: |
          mkdir -p artifacts/${ { matrix.device } }
          cp kernel_${ { matrix.device } }/out/*/dist/Image artifacts/${ { matrix.device } }/
          zip -jr artifacts/${ { matrix.device } }_kernel.zip artifacts/${ { matrix.device } }/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${ { matrix.device } }_kernel_${ { inputs.android_version } }
          path: artifacts/${ { matrix.device } }_kernel.zip
