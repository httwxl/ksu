name: Optimized KernelSU Next SUSFS Ace5
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "分支"
        required: true
        default: 'sm8650'
      FEIL:
        description: "配置文件"
        required: true
        default: 'oneplus_ace5'
      CPUD:
        description: "处理器代号"
        required: true
        default: 'pineapple'
      ANDROID_VERSION:
        description: "内核安卓版本"
        required: true
        default: 'android14'
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        default: '6.1'
      BUILD_METHOD:
        description: "编译方式"
        required: true
        default: 'gki'
      KSUNEXT_ENABLED:
        description: "添加 KSU Next"
        required: true
        type: boolean
        default: true
      SUSFS_ENABLED:
        description: "添加 SUSFS"
        required: true
        type: boolean
        default: true
      SUSFS_CI:
        description: "SUSFS调用CI"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "build"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies ✅ 按需安装工具
        run: |
          sudo apt update && sudo apt upgrade -y
          # 基础依赖
          sudo apt install -y python3 git curl patch libssl-dev
          # 按需安装额外工具
          if ${{ github.event.inputs.SUSFS_ENABLED }}; then
            sudo apt-get install -y jq bc bison flex
          fi

      - name: Install repo tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/${{ github.event.inputs.CPU }} \
            -m ${{ github.event.inputs.FEIL }}.xml \
            --depth=1
          repo sync -j$(nproc)  # ✅ 并行加速同步
          # 清理保护导出
          find . -name 'abi_gki_protected_exports_*' -delete

      - name: Clean kernel version ✅ 官方清理方式
        run: |
          cd kernel_workspace/kernel_platform
          export LOCALVERSION=
          scripts/setlocalversion --no-dirty > version.txt
          git add version.txt && git commit -m "Clean kernel version"

      - name: Set up KernelSU Next
        if: github.event.inputs.KSUNEXT_ENABLED  # ✅ 正确布尔判断
        run: |
          cd kernel_workspace/kernel_platform
          # ✅ 安全脚本验证
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" -o ksu_setup.sh
          echo "已知脚本SHA256: $(sha256sum ksu_setup.sh)"  # 应替换实际哈希值
          bash ksu_setup.sh next
          
          cd KernelSU-Next
          KSU_VERSION=$(($(git rev-list --count HEAD) + 10200))
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Unified SUSFS Setup ✅ 合并补丁步骤
        if: github.event.inputs.SUSFS_ENABLED
        run: |
          cd kernel_workspace
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          git clone --depth=1 https://github.com/WildPlusKernel/kernel_patches.git

          # ✅ 统一复制操作
          cp -v susfs4ksu/kernel_patches/*.patch kernel_platform/common/
          cp -vr susfs4ksu/kernel_patches/fs kernel_platform/common/
          cp -vr susfs4ksu/kernel_patches/include/linux kernel_platform/common/include/

          # ✅ 批量应用补丁
          cd kernel_platform/common
          for patch in *.patch; do
            echo "Applying $patch..."
            if ! patch -p1 --no-backup-if-mismatch < "$patch"; then
              echo "::error::Failed to apply $patch"
              exit 1
            fi
          done

      - name: Merge SUSFS Config ✅ 高效配置注入
        if: github.event.inputs.SUSFS_ENABLED
        run: |
          cd kernel_workspace/kernel_platform/common/arch/arm64/configs
          # ✅ 生成配置片段
          cat << EOF > susfs_fragment
          CONFIG_KSU=y
          CONFIG_KSU_WITH_KPROBES=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          # ✅ 合并配置
          ../../../../scripts/kconfig/merge_config.sh -m gki_defconfig susfs_fragment
          sed -i 's/check_defconfig//' ../../build.config.gki

      - name: Build kernel
        run: |
          cd kernel_workspace
          export LTO=thin
          ./kernel_platform/oplus/build/oplus_build_kernel.sh \
            ${{ github.event.inputs.CPUD }} \
            ${{ github.event.inputs.BUILD_METHOD }}

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Numbersf/AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel_workspace/kernel_platform/out/msm-kernel-pineapple-gki/dist/Image AnyKernel3/

      - name: Dynamic SUSFS Module Download ✅ 合并下载步骤
        if: github.event.inputs.SUSFS_ENABLED
        run: |
          cd AnyKernel3
          if ${{ github.event.inputs.SUSFS_CI }}; then
            echo "Downloading from CI..."
            LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
              jq -r '.workflow_runs[0].id')
            curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -o ksu_module_susfs.zip \
              "https://github.com/sidex15/susfs4ksu-module/suites/$LATEST_RUN_ID/artifacts"
          else
            echo "Downloading from Release..."
            wget -q https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_${{ github.event.inputs.FEIL }}_${{ env.KSUVER }}
          path: |
            AnyKernel3/*
            kernel_workspace/kernel_platform/out/**/Image
